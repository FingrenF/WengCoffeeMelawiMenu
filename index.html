<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Cafe Menu</title>
    <style>
        body { 
            margin: 0; 
            background: #121212; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        /* The Sideways Slider */
        .slider {
            display: flex;
            overflow-x: auto;
            /* Control the "Slippery" feel */
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            height: 88vh;
            -webkit-overflow-scrolling: touch;
        }

        /* Hide scrollbar */
        .slider::-webkit-scrollbar { display: none; }

        /* Each Page Wrapper */
        .page {
            min-width: 100vw;
            height: 100%;
            /* Forces it to stop at every page - No accidental skipping */
            scroll-snap-align: center;
            scroll-snap-stop: always; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        /* The Image Logic */
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            
            /* Enable native pinch-zoom and pan */
            touch-action: pan-x pan-y pinch-zoom; 
            
            /* Prevent ghost dragging */
            -webkit-user-drag: none;
            user-select: none;
        }

        /* Bottom Status Bar */
        .footer {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            background: #121212;
            border-top: 1px solid #252525;
        }

        #current { color: #fff; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="slider" id="menu-slider">
        <!-- Images generated by JS below -->
    </div>

    <div class="footer">
        PAGE <span id="current">1</span> / 22 <br>
        <small style="font-size: 10px; opacity: 0.5; letter-spacing: 1px; display: block; margin-top: 5px;">
            SWIPE SIDEWAYS • PINCH TO ZOOM
        </small>
    </div>

    <script>
        const slider = document.getElementById('menu-slider');
        const currentText = document.getElementById('current');

        // Loop to create 22 images (Assumes menu1.jpg, menu2.jpg, etc.)
        for (let i = 1; i <= 22; i++) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            
            const img = document.createElement('img');
            img.src = `menu${i}.jpg`; 
            img.loading = "lazy";
            img.alt = `Menu Page ${i}`;
            
            pageDiv.appendChild(img);
            slider.appendChild(pageDiv);
        }

        // Update the page number as you scroll
        let isScrolling;
        slider.addEventListener('scroll', () => {
            window.clearTimeout(isScrolling);
            isScrolling = setTimeout(() => {
                const index = Math.round(slider.scrollLeft / window.innerWidth) + 1;
                currentText.innerText = index;
            }, 50); // Slight delay for smoother number transition
        });
    </script>
</body>
</html>
